# Rockets / Grenades
- type: entity
  id: BulletRocketFugas
  name: rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _VXS/Weapons/Ammunition/Explosives/rpg.rsi
    layers:
      - state: fugas
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: DemolitionCharge
    maxIntensity: 17
    intensitySlope: 800
    totalIntensity: 150
    maxTileBreak: 1
  - type: SmokeOnTrigger
    duration: 2
    spreadAmount: 3
  - type: FlashOnTrigger
    range: 5
  - type: Projectile
    damage:
      types:
        Blunt: 40
    penetrationThreshold: 1000
    penetrationDamageTypeRequirement:
    - Structural

- type: entity
  id: BulletRocketThermobar
  name: rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _VXS/Weapons/Ammunition/Explosives/rpg.rsi
    layers:
      - state: thermobar
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Thermobaric
    maxIntensity: 45
    intensitySlope: 1
    totalIntensity: 300
    maxTileBreak: 1
  - type: SmokeOnTrigger
    duration: 4
    spreadAmount: 6
  - type: FlashOnTrigger
    range: 4

- type: entity
  id: BulletRocketFrag
  name: rocket
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _VXS/Weapons/Ammunition/Explosives/rpg.rsi
    layers:
      - state: frag
  - type: SmokeOnTrigger
    duration: 1
    spreadAmount: 6
  - type: FlashOnTrigger
    range: 4
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 45
    intensitySlope: 1.5
    totalIntensity: 300
